<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="Ye Khaung — Software Developer. Portfolio, projects, and contact.">
    <meta name="theme-color" content="#0b1120">
    <meta property="og:title" content="Ye Khaung — Software Developer">
    <meta property="og:description" content="I build clean, efficient web applications. Portfolio, projects, and contact.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="<%= BASE_URL %>ye-khaung-favicon.svg">
    <link rel="icon" type="image/png" href="<%= BASE_URL %>ye-khaung-favicon.png">
    <link rel="apple-touch-icon" href="<%= BASE_URL %>ye-khaung-favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <title>Ye Khaung — Software Developer</title>
    <script>
      // set the theme before first paint to avoid a flash of the wrong theme
      try {
        var t = localStorage.getItem('theme') ||
          (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <noscript>
      <strong>This site requires JavaScript to run.</strong>
    </noscript>
    <div id="app"></div>
  </body>
</html>
